services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: avitohack-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-avitohack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-avitohack}"]
      interval: 3s
      timeout: 3s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management-alpine
    container_name: avitohack-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: avitohack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    restart: unless-stopped
    image: ghcr.io/brawler2011/avitohack-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: avitohack-backend
    expose:
      - "${PORT:-8080}"
    env_file:
      - .env
    volumes:
      - ./data:/data:ro
    environment:
      PORT: "${PORT:-8080}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-avitohack}?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      REDIS_URL: "redis://redis:6379"
      CSV_USERS_PATH: "/data/users.csv"
      CSV_ACTIVITIES_PATH: "/data/user_activities.csv"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-builder:
    image: ghcr.io/brawler2011/avitohack-frontend-builder:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api/v1}"
    container_name: avitohack-frontend-builder
    restart: "no"
    volumes:
      - frontend_assets:/frontend_assets
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: avitohack-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - frontend_assets:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_assets:
  caddy_data:
  caddy_config:

