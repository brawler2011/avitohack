services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: avitohack-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-avitohack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-avitohack}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: avitohack-backend
    expose:
      - "${PORT:-8080}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-avitohack}?sslmode=disable"
      CSV_USERS_PATH: "/data/users.csv"
      CSV_ACTIVITIES_PATH: "/data/user_activities.csv"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api/v1}"
    container_name: avitohack-frontend
    expose:
      - "80"
    env_file:
      - .env
    depends_on:
      - backend

  caddy:
    image: caddy:alpine
    container_name: avitohack-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
