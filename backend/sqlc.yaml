version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/pg/queries.sql"
    schema: "../migrations/"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/pg/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
