name: CI/CD Production Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test-backend:
    name: Lint & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          check-latest: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          working-directory: backend
          args: --config=../.golangci.yaml
          install-mode: goinstall

      - name: Run Backend Tests
        working-directory: backend
        run: go test -v ./...

  lint-and-build-frontend:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Frontend Linter
        working-directory: frontend
        run: bun run lint

      - name: Run Frontend Build Check
        working-directory: frontend
        run: bun run build

  deploy:
    name: Deploy to Production VPS
    needs: [lint-and-test-backend, lint-and-build-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands for Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git remote set-url origin https://github.com/brawler2011/avitohack.git
            git fetch origin main
            git reset --hard origin/main
            cat << 'EOF' > .env
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            docker compose -f docker-compose.server.yml up -d --build --remove-orphans
            docker image prune -f
